# Single version catalog for the operator build (F0 owns this file; slices append only with a lead decision).
# FOUNDATION §4.2 / ADR-0005 tied AGP, Kotlin and the NDK to third_party/llama.cpp/examples/llama.android at
# 9588757. That example still pins AGP 8.13.2, Kotlin 2.3.0 and NDK 29.0.13113456 upstream; the build here moved
# ahead of it (AGP 9 built-in Kotlin, NDK 30), and the submodule stays at 9588757 (its Kotlin and CMake sources
# compile unchanged).
[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ndk = "30.0.16248370"

# AndroidX
core-ktx = "1.19.1"
datastore-preferences = "1.2.1"
lifecycle-service = "2.11.0"
biometric = "1.1.0"

# Kotlin libraries
coroutines = "1.11.0"
serialization-json = "1.11.0"

# Testing
androidx-junit = "1.3.0"
junit = "4.13.2"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore-preferences" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle-service" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization-json" }

kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-junit" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
